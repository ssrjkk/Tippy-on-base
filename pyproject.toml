# Tippy — MIT License, see LICENSE

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "E501",   # long lines are fine here
  "E402",   # module imports after sys.path manipulation (web/server.py, deploy/)
  "BLE001", # deliberate: bot handlers catch broad exceptions defensively
  "S110",   # deliberate: silent try/except-pass for non-critical notifications
  "S112",
  "S101",
  "SIM105", # deliberate: explicit try/except-pass reads better than suppress()
  "DTZ006", # naive datetimes used only for display formatting
  "FURB157",
  "RUF100",
  "RUF001",
  "RUF002",
  "RUF003",
  "SIM115", # open() for log files that outlive scope (deploy/launch.py)
  "B008",   # Decimal() in defaults is a constant pattern here
  "B905",   # zip strict= is pedantic for internal iterables
  "B904",   # raise-from in simple re-raises
  "F811",   # sync→async proxy redefines (bot/base.py)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "F811", "RUF059", "E741"]

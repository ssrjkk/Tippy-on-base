services:
  ci-test:
    image: python:3.12
    volumes:
      - .:/app
    working_dir: /app
    environment:
      TEST_DATABASE_URL: postgresql://tipbot:tipbot@db:5432/tipbot_test
      TEST_ADMIN_DATABASE_URL: postgresql://tipbot:tipbot@db:5432/postgres
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install -q -r requirements-dev.txt &&
             python -c \"import solcx; solcx.install_solc('0.8.24')\" &&
             coverage run -m pytest tests -q --junitxml=pytest-result.xml;
             exit $?"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tipbot
      POSTGRES_PASSWORD: tipbot
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tipbot"]
      interval: 5s
      timeout: 5s
      retries: 10

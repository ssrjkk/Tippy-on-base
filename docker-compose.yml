services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tippy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tippy}
      POSTGRES_DB: tippy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tippy"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tippy:${POSTGRES_PASSWORD:-tippy}@db:5432/tippy
      PYTHONUTF8: 1
      # The only entry to this stack is the tunnel/edge (which reaches the app
      # over the compose network), so the real client IP is the rightmost XFF
      # appended by that trusted proxy. Secure by default: this flag stays OFF
      # for any directly-exposed deployment.
      TRUST_PROXY_XFF: "1"
    # No host "ports" mapping on purpose: the app must not be directly
    # reachable on the VM's public IP — only through the cloudflared tunnel /
    # Koyeb edge. The healthcheck below runs inside the container against
    # 127.0.0.1, so it still works without a published port.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,os;u.urlopen('http://127.0.0.1:%s/api/health'%os.environ.get('WEB_PORT','8000'),timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:

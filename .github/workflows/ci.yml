name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tipbot
          POSTGRES_PASSWORD: tipbot
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tipbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Install solc (EVM contract tests)
        run: python -c "import solcx; solcx.install_solc('0.8.24')"

      - name: Lint (ruff)
        run: ruff check bot web tests scripts

      - name: Test with coverage
        env:
          PYTHONUTF8: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          coverage run -m pytest tests -q --junitxml=pytest-result.xml
          coverage report --skip-covered -m

      - name: Dump failure details
        if: failure()
        run: |
          echo "=== pytest junit summary ==="
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("pytest-result.xml").getroot()
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          print(f"--- {case.attrib.get('classname')}.{case.attrib.get('name')} [{tag}] ---")
                          print((node.text or "")[-3000:])
          except FileNotFoundError:
              print("no junit file; test process died before reporting")
          EOF

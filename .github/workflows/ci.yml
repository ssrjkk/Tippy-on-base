name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.4
      - name: Ruff check (bot web tests deploy agent scripts)
        run: ruff check bot web tests deploy agent scripts

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tipbot
          POSTGRES_PASSWORD: tipbot
          POSTGRES_DB: tipbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tipbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BOT_TOKEN: "0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      HOT_WALLET_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      WALLET_ENC_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      SECRET_KEY: "test-secret-key-for-ci-only-32ch!"
      TEST_DATABASE_URL: "postgresql://tipbot:tipbot@localhost:5432/tipbot_test"
      TEST_ADMIN_DATABASE_URL: "postgresql://tipbot:tipbot@localhost:5432/postgres"
      # bot/ledger.py opens its module-level singleton at import time, so the
      # pytest job must point DATABASE_URL at the service database (5432) too —
      # the 5433 default would fail the import before any test runs.
      DATABASE_URL: "postgresql://tipbot:tipbot@localhost:5432/tipbot"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
      - name: Vendor contract dependencies
        run: bash scripts/setup_foundry.sh
      - name: Forge build
        run: forge build
      - name: Forge test
        run: forge test -vvv

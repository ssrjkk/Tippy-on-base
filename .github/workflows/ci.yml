name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tipbot
          POSTGRES_PASSWORD: tipbot
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tipbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Install solc (EVM contract tests)
        run: python -c "import solcx; solcx.install_solc('0.8.24')"

      - name: Lint (ruff)
        run: ruff check bot web tests scripts

      - name: Test with coverage
        run: |
          coverage run -m pytest tests -q
          coverage report --skip-covered -m

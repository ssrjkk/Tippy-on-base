[profile.default]
src = "contracts"
out = "out"
libs = ["contracts/lib"]
script = "contracts/script"
test = "contracts/test"
# Vendored dependency repos ship their own test/script files that need
# remappings we don't provide (halmos, PRBTest) — never build or scan them.
skip = ["*/lib/*/test/*", "*/lib/*/src/test/*", "*/lib/*/script/*", "*/lib/*/contracts/*", "*/lib/*/certora/*"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read", path = "out" }]

[rpc_endpoints]
base = "${BASE_RPC_URL}"
localhost = "http://127.0.0.1:8545"
